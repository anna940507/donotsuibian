const ov=document.createElement("div");ov.id="ov";ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);overflow:auto;padding:16px;z-index:9;text-align:center;color:#fff";
ov.innerHTML=`<img src="${o.toDataURL("image/png")}" style="max-width:100%;border-radius:12px"><p>長按圖片即可儲存</p><button class="btn go" onclick="share()">分享／下載圖片</button><button class="btn" onclick="document.getElementById('ov').remove()" style="text-align:center">關閉</button>`;document.body.appendChild(ov)}
function share(){lastCv.toBlob(b=>{const f=new File([b],"dont-suibian.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dont-suibian.png";a.click()}})}
const app=document.getElementById("app");let i,sc,n67,seen;
function gal(){app.innerHTML=`<h2>所有角色</h2><p class="mut">共 14 種，另有 2 個隱藏彩蛋 🤫</p>`+Object.keys(R).filter(k=>k!="bday"&&k!="s67").map(k=>`<button class="btn" onclick="res('${k}',null,1)">${R[k][0]} <b>${R[k][1]}</b><br><span class="mut">${R[k][2]}</span></button>`).join("")+`<button class="btn" style="text-align:center" onclick="start()">← 回首頁</button>`;window.scrollTo(0,0)}
function start(){app.innerHTML=`<div class="card c"><div class="em">🎲</div><h1>你是哪種活動怪？</h1><p class="mut">Don't 隨便 × 8 題小測驗<br>揪團、遲到、算錢…你在朋友圈是誰？</p><button class="btn go" onclick="begin()">開始測驗</button></div>`}
function begin(){i=0;sc={};n67=0;seen={};ord={};hist=[];show()}
let cur=[],ord={},hist=[];
function show(){const q=Q[i];if(!ord[i]){const c=[...q[1]];if(T67[i])c.push([T67[i],"S67"]);for(let a=c.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[c[a],c[b]]=[c[b],c[a]]}ord[i]=c}cur=ord[i];
app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="mut">第 ${i+1} / ${Q.length} 題</p><h2>${q[0]}</h2>`+cur.map((o,k)=>`<button class="btn" onclick="pick(${k},this)">${o[0]}</button>`).join("")+(i>0?`<button class="btn" style="text-align:center;color:var(--mut)" onclick="back()">← 返回上一題</button>`:"")}
function back(){const h=hist.pop();sc=h.sc;seen=h.seen;n67=h.n67;i--;show()}
let lock=0;function pick(k,b){if(lock)return;lock=1;if(b)b.classList.add("sel");setTimeout(()=>{lock=0;pick0(k)},170)}
function pick0(k){const c=cur[k][1];if(c=="BDAY")return res("bday");hist.push({sc:{...sc},seen:{...seen},n67});if(c=="S67")n67++;else{c.split(" ").forEach((x,j)=>{sc[x]=(sc[x]||0)+(j?1:2);seen[x]=i})}i++;i<Q.length?show():fin()}
function fin(){if(n67>=3)return res("s67");const a=Object.keys(sc).sort((x,y)=>sc[y]/Math.pow(TOT[y],.75)-sc[x]/Math.pow(TOT[x],.75)||seen[y]-seen[x]);res(a[0]||"fo",a[1])}
function vid(k,f){app.innerHTML=`<video id="vd" src="${V[k]}" playsinline autoplay controls style="width:100%;border-radius:12px"></video><button class="btn" style="text-align:center" id="sk">跳過</button>`;const v=document.getElementById("vd");v.onended=f;v.onerror=f;document.getElementById("sk").onclick=f}
function mini(ru,p){const f=(l,x)=>x?`<div class="mini"><small>${l}</small><div>${R[x][0]}</div><b>${R[x][1]}</b></div>`:"";const h=f("也有點像",ru)+f("最合拍",p);return h?`<div class="two">${h}</div>`:""}
function res(k,ru,g,sk){if(!g&&!sk&&V[k])return vid(k,()=>res(k,ru,g,1));const r=R[k];curRu=ru;curG=g;app.innerHTML=`<div class="card rev" style="--ac:${T[cc]}"><div class="em">${r[0]}</div><p class="mut c">你的活動人格是</p><h1 class="c">${r[1]}</h1><p class="q c">${r[2]}</p><p class="tag c">${r[3]}</p><p>${r[4].replace(/\n/g,"<br>")}</p>${mini(ru,P[k])}${S[k]&&!g?bars(k):""}${r[5]?`<p class="mut">💬 Don't 隨便 小語：${r[5]}</p>`:""}</div><p class="mut c" style="margin-bottom:6px">卡片顏色</p><div class="c" style="margin-bottom:14px">${T.map((x,j)=>`<button class="dot${j==cc?" on":""}" style="background:${x}" onclick="th(${j})"></button>`).join("")}</div><button class="btn go" onclick="save('${k}')">💾 儲存結果圖片</button>${g?"":`<button class="btn" style="text-align:center" onclick="gal()">瀏覽所有角色</button>`}${g?`<button class="btn" style="text-align:center" onclick="gal()">← 回角色列表</button>`:`<button class="btn" style="text-align:center" onclick="begin()">再測一次</button>`}`;window.scrollTo(0,0)}
start();
</script></body></html>
